<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b2340"><title>Daily Bread</title>
<style>
:root{--ink:#2b2620;--muted:#7a6a55;--gold:#a8782c;--paper:#fbf7f0;--card:#fff;--fs:21px}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-size:var(--fs);line-height:1.7}
.hero{position:relative;min-height:56vh;padding:28px 24px 96px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;
background:linear-gradient(180deg,#2b2340 0%,#5b3f63 30%,#c06c5a 62%,#f0b26a 85%,#f8d9a0 100%);overflow:hidden}
.hero svg{position:absolute;left:0;right:0;bottom:-2px;width:100%;height:40%}
.sun{position:absolute;left:50%;bottom:20%;width:200px;height:200px;margin-left:-100px;border-radius:50%;background:radial-gradient(circle,#fff6d8 0%,#ffd98a 40%,rgba(255,200,120,0) 70%)}
.top{position:absolute;top:18px;left:22px;right:22px;display:flex;justify-content:space-between;align-items:center;font:600 15px/1 -apple-system,system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase}
.top button{font:600 16px/1 -apple-system,system-ui,sans-serif;background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:20px;padding:10px 14px}
.date{position:relative;z-index:1;font:600 16px/1.3 -apple-system,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#fff3df;text-shadow:0 1px 6px #0008}
h1{position:relative;z-index:1;margin:8px 0 0;font-size:42px;line-height:1.12;font-weight:normal;text-shadow:0 2px 14px #0008}
main{max-width:640px;margin:-64px auto 0;padding:0 18px 70px;position:relative;z-index:2}
.verse{background:var(--card);border-radius:22px;padding:28px 26px;box-shadow:0 10px 30px rgba(60,40,20,.13)}
.verse p{margin:0;font-size:calc(var(--fs) + 4px);line-height:1.55;font-style:italic}
.verse p:before{content:"\201C";display:block;font-size:64px;line-height:.6;color:var(--gold);font-style:normal;margin-bottom:6px}
.ref{margin-top:16px;font:600 17px/1.3 -apple-system,system-ui,sans-serif;color:var(--muted);letter-spacing:.04em}
.actions{display:flex;gap:10px;margin:20px 0 6px}
.actions button{flex:1;font:600 18px/1 -apple-system,system-ui,sans-serif;padding:16px 8px;border-radius:14px;border:1.5px solid #e4d6bf;background:#fff;color:var(--ink)}
.actions button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
h2{font:700 14px/1 -apple-system,system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:40px 0 14px}
.body p{margin:0 0 1.1em}
.body p:first-child:first-letter{float:left;font-size:3.3em;line-height:.9;padding:6px 8px 0 0;color:var(--gold)}
.today{background:#f3e9d6;border-radius:18px;padding:22px 24px;font-size:calc(var(--fs) + 1px)}
.today strong{display:block;font:700 14px/1 -apple-system,system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.prayer{border-left:3px solid var(--gold);padding-left:20px;font-style:italic}
nav{display:flex;gap:12px;margin-top:46px}
nav a{flex:1;text-align:center;padding:18px;background:#fff;border:1.5px solid #e4d6bf;border-radius:14px;color:var(--ink);text-decoration:none;font:600 18px/1 -apple-system,system-ui,sans-serif}
footer{text-align:center;color:var(--muted);font-size:15px;margin-top:36px;font-family:-apple-system,system-ui,sans-serif}
</style></head><body>
<header class="hero"><div class="sun"></div>
<svg viewBox="0 0 400 160" preserveAspectRatio="none"><path d="M0 90 Q80 40 160 80 T320 70 T400 80 V160 H0Z" fill="#7a4e5c" opacity=".55"/><path d="M0 120 Q100 70 200 110 T400 100 V160 H0Z" fill="#4a3448" opacity=".75"/><path d="M0 140 Q120 120 240 140 T400 135 V160 H0Z" fill="#fbf7f0"/></svg>
<div class="top"><span>Daily Bread</span><button id="sz" aria-label="Change text size">Aa</button></div>
<div class="date" id="date"></div><h1 id="title">Loading…</h1></header>
<main id="m"></main>
<script>
var S=[19,21,24,27],si=+(localStorage.fs||1);function setfs(){document.documentElement.style.setProperty('--fs',S[si]+'px')}setfs();
document.getElementById('sz').onclick=function(){si=(si+1)%S.length;localStorage.fs=si;setfs()};
function ny(){return new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function shift(d,n){var t=new Date(d+'T12:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
var q=new URLSearchParams(location.search).get('d'),pm=location.pathname.match(/\/d\/(\d{4}-\d{2}-\d{2})/);
var d=(pm&&pm[1])||(q&&/^\d{4}-\d{2}-\d{2}$/.test(q)?q:ny());
document.getElementById('date').textContent=new Date(d+'T12:00:00Z').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',timeZone:'UTC'});
fetch('/devotions.json',{cache:'no-cache'}).then(r=>r.json()).then(function(all){
var m=document.getElementById('m'),e=all[d],T=document.getElementById('title');
if(!e){var keys=Object.keys(all).sort(),k=keys.filter(x=>x<=d).pop()||keys[0];T.textContent='The Word Endures';
m.innerHTML='<div class="verse"><p>The grass withers, the flower fades; but the word of our God stands forever.</p><div class="ref">Isaiah 40:8 · WEB</div></div><h2>Note</h2><p>There isn\'t a devotional for this day yet.</p><nav><a href="/d/'+k+'">Read '+k+'</a></nav>';return}
T.textContent=e.title;document.title=e.title+' · Daily Bread';
var paras=e.reflection.split(/\n\s*\n/).map(p=>'<p>'+esc(p.trim())+'</p>').join('');
var p=shift(d,-1),n=shift(d,1);
m.innerHTML='<div class="verse"><p>'+esc(e.verse)+'</p><div class="ref">'+esc(e.reference)+' · '+e.translation+'</div></div>'+
'<div class="actions"><button class="primary" id="listen">▶ Listen</button><button id="share">Share</button></div>'+
'<h2>Reflection</h2><div class="body">'+paras+'</div>'+
'<div class="today"><strong>For Today</strong>'+esc(e.today)+'</div>'+
'<h2>Prayer</h2><p class="prayer">'+esc(e.prayer)+'</p>'+
'<nav>'+(all[p]?'<a href="/d/'+p+'">← Yesterday</a>':'')+(all[n]?'<a href="/d/'+n+'">Tomorrow →</a>':'')+'</nav>'+
'<footer>Scripture: World English Bible (public domain)</footer>';
var L=document.getElementById('listen');L.onclick=function(){var s=speechSynthesis;if(s.speaking){s.cancel();L.textContent='▶ Listen';return}
var u=new SpeechSynthesisUtterance(e.title+'. '+e.reference+'. '+e.verse+' '+e.reflection.replace(/\n+/g,' ')+' For today: '+e.today+' Let us pray. '+e.prayer);u.rate=.9;u.onend=()=>L.textContent='▶ Listen';s.speak(u);L.textContent='■ Stop'};
document.getElementById('share').onclick=function(){var url=location.origin+'/d/'+d,t='“'+e.verse+'” — '+e.reference;
if(navigator.share)navigator.share({title:e.title,text:t,url:url}).catch(()=>{});else{navigator.clipboard&&navigator.clipboard.writeText(t+' '+url);this.textContent='Copied ✓'}};
}).catch(()=>{document.getElementById('m').innerHTML='<p>Sorry, the devotional could not load. Please try again.</p>'});
</script></body></html>
